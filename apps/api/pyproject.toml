[project]
name = "inteylo-api"
version = "0.1.0"
description = "API principale d'INTEYLO (monolithe modulaire FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.4",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "argon2-cffi==25.1.0",
  "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "bandit==1.9.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"app/core/messages_fr.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
