# Surcharge de production (un serveur Linux).
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Prérequis : fichiers de secrets dans ./secrets/ (voir docs/deployment/README.md),
# images publiées (INTEYLO_IMAGE_PREFIX=ghcr.io/<compte>/inteylo, INTEYLO_VERSION=<sha>).

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      INTEYLO_OWNER_PASSWORD: !reset null
      INTEYLO_OWNER_PASSWORD_FILE: /run/secrets/owner_password
      INTEYLO_APP_PASSWORD: !reset null
      INTEYLO_APP_PASSWORD_FILE: /run/secrets/app_password
    secrets: [postgres_password, owner_password, app_password]

  migrate:
    build: !reset null
    environment:
      INTEYLO_MIGRATION_DATABASE_URL: !reset null
      INTEYLO_MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [migration_database_url]

  api:
    ports: !reset []
    environment:
      INTEYLO_ENVIRONMENT: production
      INTEYLO_DATABASE_URL: !reset null
      INTEYLO_DATABASE_URL_FILE: /run/secrets/database_url
      INTEYLO_COOKIE_SECURE: "true"
      INTEYLO_PUBLIC_WEB_URL: https://${INTEYLO_DOMAIN:?définir INTEYLO_DOMAIN}
    secrets: [database_url]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  web:
    build: !reset null
    ports: !reset []
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  proxy:
    image: caddy:2
    depends_on: [web, api]
    environment:
      INTEYLO_DOMAIN: ${INTEYLO_DOMAIN}
      INTEYLO_ACME_EMAIL: ${INTEYLO_ACME_EMAIL:?définir INTEYLO_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, app]
    restart: unless-stopped

networks:
  edge: {}
  data:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  owner_password: { file: ./secrets/owner_password }
  app_password: { file: ./secrets/app_password }
  migration_database_url: { file: ./secrets/migration_database_url }
  database_url: { file: ./secrets/database_url }
